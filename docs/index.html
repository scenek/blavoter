<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blažovický pivní cirkus – 22. 8. 2026">
    <title>Pivní cirkus Blažovice 2026</title>
    <style>
        :root {
            --color-voting: #7a3100;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            display: grid;
            place-items: center;
            background: #f4f1e8;
            color: #31170c;
            font-family: system-ui, sans-serif;
        }

        .landing {
            display: grid;
            gap: 22px;
            width: min(100%, 640px);
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--color-voting);
            font-size: clamp(2.25rem, 8vw, 4rem);
            line-height: 1.05;
            text-wrap: balance;
        }

        .landing-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            justify-self: center;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgb(0 0 0 / 18%);
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .voting-link {
            padding: 18px 24px;
            background: var(--color-voting);
            color: #fff;
            font-size: clamp(1.35rem, 5vw, 1.85rem);
            font-weight: 800;
            line-height: 1.2;
        }

        .facebook-link {
            padding: 13px 18px;
            background: #1877f2;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 750;
        }

        .facebook-icon {
            width: 24px;
            height: 24px;
            flex: 0 0 auto;
        }

        .landing-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgb(0 0 0 / 24%);
        }

        .landing-link:focus-visible {
            outline: 4px solid #1877f2;
            outline-offset: 5px;
        }

        .menu-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgb(49 23 12 / 16%);
        }

        @media (prefers-reduced-motion: reduce) {
            .landing-link {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="landing">
        <h1>Pivní cirkus Blažovice 2026</h1>
        <a class="landing-link voting-link"
           href="/event/9JNv5iAost2izyYxJaff/pivn%C3%AD-cirkus-2026">Hlasování</a>
        <a class="landing-link facebook-link"
           href="https://www.facebook.com/events/2145978482970443?"
           target="_blank"
           rel="noopener noreferrer">
            <svg class="facebook-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07Z"/>
            </svg>
            <span>Facebook</span>
        </a>
        <img class="menu-image"
             src="stepis.jpg"
             width="594"
             height="798"
             alt="Jídelní nabídka Steppi's pro Blažovický pivní cirkus 2026">
    </main>
</body>
</html>
